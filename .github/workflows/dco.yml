# SPDX-License-Identifier: Apache-2.0
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "<$author>"; then
              echo "::error::Commit $sha has no Signed-off-by line matching its author ($author)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with: git commit -s   (or: git rebase --signoff $BASE)"
            exit 1
          fi
          echo "All commits are signed off."
