version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - misspell
    - revive
    - unconvert
    # A privilege tool must not paper over a failed write, and must not build
    # SQL by concatenation where a parameter will do.
    - sqlclosecheck
    - rowserrcheck

  settings:
    revive:
      rules:
        # Exported API carries doc comments. Methods on unexported types do
        # not: requiring them there produces noise, not documentation.
        - name: exported

  exclusions:
    rules:
      # Closing a response body in a test that is about to end adds nothing.
      - path: _test\.go
        linters: [errcheck]
