# db-iam quickstart.
#
#   make up                          # or: docker compose -f this-file up --build -d
#   open http://127.0.0.1:8080
#
# This file defines db-iam itself: the API and the console.
#
# The database being managed lives in docker-compose.postgres.yml, which is
# deliberately not tracked in git. A target is somebody's infrastructure, and
# how you reach it — host, credential, TLS mode — is local to you. Copy
# docker-compose.postgres.yml.example to start, or delete it entirely and point
# DBIAM_TARGETS at a database you already run.
#
# This stack has no authentication. The console and API both reach a privileged
# database connection, so every published port is bound to the loopback address
# and must stay there.
#
# Host ports are overridable, and Postgres deliberately does not default to
# 5432: a developer running db-iam is very likely to have a local Postgres on
# it already.
#
#   DBIAM_CONSOLE_PORT=9000 make up

name: dbiam

services:
  # ------------------------------------------------------------------- dbiam
  # The API. Published for curl; the console reaches it over the compose
  # network, not through this port.
  dbiam:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: compose-dev
    container_name: dbiam-api
    depends_on:
      postgres:
        condition: service_healthy
        # Declared here but satisfied by docker-compose.postgres.yml. Drop this
        # block if you point DBIAM_TARGETS at a database outside the stack.
    environment:
      DBIAM_ADDR: ":8080"
      DBIAM_TARGETS: "demo-pg=postgres://dbiam_admin:demo-not-a-real-secret@postgres:5432/app?sslmode=disable"
      # sslmode=disable is tolerable only because both ends sit inside this
      # compose network. Any real target uses verify-full.
    ports:
      - "127.0.0.1:${DBIAM_API_PORT:-8081}:8080"
    healthcheck:
      # The image is distroless: no shell, no wget, no curl. The dbiam CLI
      # ships alongside the server precisely so there is something to exec.
      test: ["CMD", "/usr/local/bin/dbiam", "version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # ----------------------------------------------------------------- console
  # Serves the console and reverse-proxies /api to dbiam, so the browser sees a
  # single origin and there is no CORS policy to maintain.
  #
  # The server binary also embeds this console, which stays the right answer
  # for a single-binary deployment. This container is for stacks that want the
  # front end released or scaled on its own.
  console:
    build:
      context: ../..
      dockerfile: deploy/compose/console/Dockerfile
    container_name: dbiam-console
    depends_on:
      dbiam:
        condition: service_started
    ports:
      - "127.0.0.1:${DBIAM_CONSOLE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      # nginx needs somewhere to write temp bodies and its pid under a
      # read-only root.
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
