# Console front end.
#
# nginx serves the static console and reverse-proxies the API to the db-iam
# container. Proxying rather than letting the browser call the API directly
# keeps everything on one origin, so there is no CORS policy to get wrong and
# no preflight to debug.

server {
    # The unprivileged image runs as a non-root user, which cannot bind :80.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The console reaches a privileged database connection. Same headers the
    # embedded console sets, since this serves the identical assets.
    #
    # These live at server level and nothing below may add a header of its own:
    # nginx inherits add_header directives only when the current level declares
    # none, so a single add_header inside a location silently drops every one
    # of these. Cache-Control is here for that reason rather than in location /,
    # where it would take the security headers with it.
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header X-Frame-Options         "DENY"        always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Cache-Control           "no-store"    always;
    # script-src and style-src are spelled out rather than left to fall back to
    # default-src, because the fallback is what made the last policy look
    # correct while it silently blocked the console's own script. No
    # 'unsafe-inline' anywhere: the page has no inline script and no style
    # attributes, so it does not need one.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker's embedded DNS, with a short TTL. Resolving through a variable
        # forces nginx to look the upstream up again rather than pinning the
        # address it saw at startup, so restarting db-iam does not leave the
        # console proxying to an IP that no longer exists.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dbiam_upstream dbiam;

        proxy_pass         http://$dbiam_upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Introspecting a large cluster takes longer than nginx's default.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # nginx's own liveness, answered without touching the API.
    # No add_header here either, for the reason given above; the default
    # text/plain from return is adequate.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
