# Development override: serve the console straight from the working tree, so
# an edit to index.html is one refresh away rather than one rebuild.
#
#   make up-dev
#
# The images are unchanged; this only shadows the copy baked into each.

services:
  console:
    volumes:
      - ../../internal/server/web:/usr/share/nginx/html:ro

  dbiam:
    # The API container serves its embedded console at / as well. Point it at
    # the working tree too, so both paths show the same thing.
    environment:
      DBIAM_WEB_DIR: /web
    volumes:
      - ../../internal/server/web:/web:ro
